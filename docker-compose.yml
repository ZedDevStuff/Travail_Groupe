services:

  # ─────────────────────────────────────────
  # PostgreSQL — 4 bases dans une instance
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: biblio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: service_livres      # base par défaut
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # PgAdmin (interface web PostgreSQL)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: biblio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@biblio.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: biblio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Zookeeper (requis par Kafka)
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: biblio_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Kafka
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: biblio_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"   # accessible depuis Django en local via localhost:29092
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Kafka UI
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: biblio_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Kong Database (PostgreSQL dédié à Kong)
  # ─────────────────────────────────────────
  kong-db:
    image: postgres:13-alpine       # Kong 2.8 est testé avec Postgres 13
    container_name: biblio_kong_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Kong migrations (tourne une fois puis s'arrête)
  # ─────────────────────────────────────────
  kong-migrations:
    image: kong:2.8
    container_name: biblio_kong_migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    depends_on:
      kong-db:
        condition: service_healthy
    networks:
      - biblio_net
    restart: on-failure

  # ─────────────────────────────────────────
  # Kong Gateway 2.8 (compatible Konga)
  # ─────────────────────────────────────────
  kong:
    image: kong:2.8
    container_name: biblio_kong
    restart: unless-stopped
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"   # proxy — Nuxt appellera les APIs via ce port
      - "8001:8001"   # admin API — utilisée par Konga
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # Konga (UI pour Kong 2.8)
  # ─────────────────────────────────────────
  konga:
    image: pantsel/konga:0.14.9     # version fixée — évite les surprises
    container_name: biblio_konga
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NODE_ENV: development
      TOKEN_SECRET: quelquechosederandom
    ports:
      - "1337:1337"
    networks:
      - biblio_net

  # ─────────────────────────────────────────
  # MinIO (stockage fichiers — couvertures)
  # ─────────────────────────────────────────
  # minio:
  #   image: minio/minio:RELEASE.2024-11-07T00-52-20Z
  #   container_name: biblio_minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"   # API S3 — connexion Django
  #     - "9001:9001"   # Console web MinIO
  #   networks:
  #     - biblio_net


volumes:
  postgres_data:
  kong_db_data:
  # minio_data:    # à décommenter au Bloc 5

networks:
  biblio_net:
    driver: bridge